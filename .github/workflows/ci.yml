name: data-science-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate notebooks
        run: python -m nbconvert --to notebook --execute notebooks/02_features_split_temporel.ipynb --output-dir notebooks/ci_output

      - name: Check DVC pipeline definition
        run: dvc dag