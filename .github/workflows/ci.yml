name: data-science-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Python sources
        run: python -m compileall src app.py

      - name: Check DVC pipeline definition
        run: dvc dag

      - name: Build Streamlit image
        run: docker build --tag conso-energie-streamlit .