name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Qualité du code (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - name: Lint
        run: ruff check .

  tests:
    name: Tests unitaires (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Tests
        run: python -m pytest -v tests

  pipeline:
    name: Pipeline DVC
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Graphe du pipeline
        run: |
          echo "## Pipeline DVC" >> "$GITHUB_STEP_SUMMARY"
          dvc dag --md >> "$GITHUB_STEP_SUMMARY"
