name: Préparer l'environnement
description: Python, dépendances et accès DVC à DagsHub
inputs:
  dagshub-username:
    description: Utilisateur DagsHub
    required: false
  dagshub-token:
    description: Token DagsHub
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements*.txt

    - name: Installer les dépendances
      shell: bash
      run: pip install -r requirements-dev.txt

    - name: Configurer l'accès DVC à DagsHub
      if: inputs.dagshub-token != ''
      shell: bash
      run: |
        dvc remote modify --local dagshub user "${{ inputs.dagshub-username }}"
        dvc remote modify --local dagshub password "${{ inputs.dagshub-token }}"
